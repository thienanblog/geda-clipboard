name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  WAILS_VERSION: v2.12.0

jobs:
  # Formatting and the Windows-only sources can be checked without a matching
  # host, so they share the cheapest runner. Only ./internal/... is vetted here:
  # the root package embeds frontend/dist, which does not exist until the
  # frontend has been built.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet the Windows sources on both architectures
        run: |
          GOOS=windows GOARCH=amd64 go vet ./internal/...
          GOOS=windows GOARCH=arm64 go vet ./internal/...

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check the frontend
        working-directory: frontend
        run: npx vue-tsc --noEmit

  # The platform layers are separate implementations behind build tags, so each
  # host vets, tests and builds its own. Windows in particular has no other
  # coverage: it is not a machine this project is developed on.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Runs first because it produces frontend/dist, which the root package
      # embeds -- go vet and go test cannot load that package without it.
      - name: wails build
        run: wails build -clean

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Windows is not a machine this project is developed on, so without this
      # there is no way to actually run a change on it short of cutting a
      # release tag. The executable is attached to the run, downloadable from
      # its summary page. Public repositories are not billed for this.
      - name: Upload the Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: geda-clipboard-windows-amd64
          path: "build/bin/Geda Clipboard.exe"
          if-no-files-found: error
          retention-days: 14
