<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="0.55" stop-color="#1a6ee0"/>
      <stop offset="1" stop-color="#0a4fb4"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0fb"/>
    </linearGradient>

    <filter id="artShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#062f6b" flood-opacity="0.30"/>
    </filter>

    <filter id="bodyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded-square app body -->
  <g filter="url(#bodyShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <!-- top gloss + hairline rim -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="6"/>

  <g filter="url(#artShadow)">
    <!-- history sheets stacked behind -->
    <rect x="368" y="220" width="340" height="430" rx="48" fill="#ffffff" opacity="0.28"/>
    <rect x="324" y="250" width="340" height="430" rx="48" fill="#ffffff" opacity="0.50"/>

    <!-- clipboard board -->
    <rect x="280" y="280" width="340" height="430" rx="48" fill="url(#sheet)"/>

    <!-- clip -->
    <rect x="380" y="246" width="140" height="86" rx="30" fill="#d7e4f7"/>
    <rect x="404" y="222" width="92" height="62" rx="31" fill="none" stroke="#b9cde9" stroke-width="20"/>

    <!-- content lines -->
    <rect x="336" y="404" width="228" height="34" rx="17" fill="#1a6ee0"/>
    <rect x="336" y="480" width="228" height="34" rx="17" fill="#9dc0ec"/>
    <rect x="336" y="556" width="150" height="34" rx="17" fill="#9dc0ec"/>
  </g>
</svg>
